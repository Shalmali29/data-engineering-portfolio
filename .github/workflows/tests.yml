name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r 01-multilingual-ecommerce-pipeline/requirements.txt
      - run: |
          cd 01-multilingual-ecommerce-pipeline
          python -m src.pipeline
          pytest -q

  pyspark-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install PySpark project dependencies
        run: python -m pip install -r 02-pyspark-large-scale-processing/requirements.txt
      - name: Generate synthetic catalogue data
        working-directory: 02-pyspark-large-scale-processing
        run: python src/generate_data.py
      - name: Run PySpark tests
        working-directory: 02-pyspark-large-scale-processing
        env:
          PYSPARK_PYTHON: python
        run: pytest -q

  schema-integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r 03-multi-schema-catalogue-integration/requirements.txt
      - name: Run schema integration pipeline
        working-directory: 03-multi-schema-catalogue-integration
        run: python -m src.pipeline
      - name: Run schema integration tests
        working-directory: 03-multi-schema-catalogue-integration
        run: pytest -q

  cloud-asset-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r 04-cloud-image-asset-pipeline/requirements.txt
      - name: Generate synthetic catalogue and image fixture
        working-directory: 04-cloud-image-asset-pipeline
        run: python -m src.generate_sample_data
      - name: Run local asset pipeline
        working-directory: 04-cloud-image-asset-pipeline
        run: python -m src.pipeline
      - name: Run asset pipeline tests
        working-directory: 04-cloud-image-asset-pipeline
        run: pytest -q

  real-estate-rag-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r 05-real-estate-rag-data-pipeline/requirements.txt
      - name: Generate synthetic property catalogue
        working-directory: 05-real-estate-rag-data-pipeline
        run: python -m src.generate_sample_data
      - name: Run property ETL
        working-directory: 05-real-estate-rag-data-pipeline
        run: python -m src.pipeline
      - name: Run data pipeline and retrieval tests
        working-directory: 05-real-estate-rag-data-pipeline
        run: pytest -q

  data-quality-monitoring-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r 06-data-quality-pipeline-monitoring/requirements.txt
      - name: Generate synthetic catalogue batch
        working-directory: 06-data-quality-pipeline-monitoring
        run: python -m src.generate_sample_data
      - name: Run quality monitoring pipeline
        working-directory: 06-data-quality-pipeline-monitoring
        run: python -m src.monitor
      - name: Run data quality tests
        working-directory: 06-data-quality-pipeline-monitoring
        run: pytest -q

  euro-cup-analytics-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r 07-euro-cup-match-data-analysis/requirements.txt
      - name: Generate synthetic match data
        working-directory: 07-euro-cup-match-data-analysis
        run: python -m src.generate_data
      - name: Run match analytics pipeline
        working-directory: 07-euro-cup-match-data-analysis
        run: python -m src.pipeline
      - name: Run analytics tests
        working-directory: 07-euro-cup-match-data-analysis
        run: pytest -q
