name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r 01-multilingual-ecommerce-pipeline/requirements.txt
      - run: |
          cd 01-multilingual-ecommerce-pipeline
          python -m src.pipeline
          pytest -q
