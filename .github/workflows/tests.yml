name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r 01-multilingual-ecommerce-pipeline/requirements.txt
      - run: |
          cd 01-multilingual-ecommerce-pipeline
          python -m src.pipeline
          pytest -q

  pyspark-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install PySpark project dependencies
        run: python -m pip install -r 02-pyspark-large-scale-processing/requirements.txt
      - name: Generate synthetic catalogue data
        working-directory: 02-pyspark-large-scale-processing
        run: python src/generate_data.py
      - name: Run PySpark tests
        working-directory: 02-pyspark-large-scale-processing
        env:
          PYSPARK_PYTHON: python
        run: pytest -q

  schema-integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r 03-multi-schema-catalogue-integration/requirements.txt
      - name: Run schema integration pipeline
        working-directory: 03-multi-schema-catalogue-integration
        run: python -m src.pipeline
      - name: Run schema integration tests
        working-directory: 03-multi-schema-catalogue-integration
        run: pytest -q
